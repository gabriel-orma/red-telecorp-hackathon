# Stack WORKFLOWS: detección de incidentes colectivos (DynamoDB Streams) y su ciclo de vida (Step Functions).
service: telecorp-workflows
frameworkVersion: "3"

plugins:
  - serverless-step-functions

custom:
  base: telecorp-base-${sls:stage}
  prefijo: telecorp-${sls:stage}

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  memorySize: 256
  timeout: 30
  logRetentionInDays: 7
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  layers:
    - ${cf:${self:custom.base}.ComunLambdaLayerQualifiedArn}
  environment:
    STAGE: ${sls:stage}
    TABLA_INCIDENCIAS: ${cf:${self:custom.base}.TablaIncidenciasNombre}
    TABLA_HISTORIAL: ${cf:${self:custom.base}.TablaHistorialNombre}
    TABLA_ANTENAS: ${cf:${self:custom.base}.TablaAntenasNombre}
    TABLA_COLECTIVOS: ${cf:${self:custom.base}.TablaColectivosNombre}
    TABLA_DEDUP: ${cf:${self:custom.base}.TablaDedupNombre}
    TOPICO_AVISOS: ${cf:${self:custom.base}.TopicoAvisosArn}
    TOPICO_ALERTAS: ${cf:${self:custom.base}.TopicoAlertasOperadorArn}

package:
  patterns: ["!**", "src/**"]

functions:
  detector:
    handler: src/detector.handler
    name: ${self:custom.prefijo}-detector
    environment:
      MAQUINA_COLECTIVO: !Ref MaquinaIncidenteColectivo
    events:
      - stream:
          type: dynamodb
          arn: ${cf:${self:custom.base}.TablaIncidenciasStreamArn}
          startingPosition: LATEST
          batchSize: 20
          maximumRetryAttempts: 3
          bisectBatchOnFunctionError: true
          destinations:
            onFailure:
              arn: ${cf:${self:custom.base}.ColaDetectorDLQArn}
              type: sqs
          filterPatterns:
            - eventName: [INSERT]
      - stream:
          type: dynamodb
          arn: ${cf:${self:custom.base}.TablaAntenasStreamArn}
          startingPosition: LATEST
          batchSize: 20
          maximumRetryAttempts: 3
          bisectBatchOnFunctionError: true
          destinations:
            onFailure:
              arn: ${cf:${self:custom.base}.ColaDetectorDLQArn}
              type: sqs
          filterPatterns:   # solo la TRANSICIÓN a falla (H25): no una invocación por cada lectura mientras siga caída
            - dynamodb:
                NewImage: { estado: { S: [CAIDA, INHABILITADA] } }
                OldImage: { estado: { S: [{ anything-but: [CAIDA, INHABILITADA] }] } }
            - eventName: [INSERT]   # primera lectura de la antena (aún no hay OldImage)
              dynamodb: { NewImage: { estado: { S: [CAIDA, INHABILITADA] } } }

  # Barrido de reconciliación (H08): red de seguridad si un evento del stream se perdió o llegó fuera de orden.
  # Reevalúa cada zona y arranca la Step Function de colectivos "zombi". Sin costo fijo (≈8.600 invocaciones/mes).
  reconciliador:
    handler: src/detector.reconciliar
    name: ${self:custom.prefijo}-reconciliador
    timeout: 60
    environment:
      MAQUINA_COLECTIVO: !Ref MaquinaIncidenteColectivo
    events:
      - schedule:
          rate: rate(5 minutes)
          enabled: true

  # Pasos de la Step Function
  # (los timeouts de las Lambdas de lote/cierre son mayores que el estándar de 30 s: procesan cientos de usuarios)
  prepararNotificacion: { handler: src/pasos.preparar_notificacion }
  notificarLote: { handler: src/pasos.notificar_lote, timeout: 120 }
  verificarInfraestructura: { handler: src/pasos.verificar_infraestructura }
  priorizar: { handler: src/pasos.priorizar }
  resumir: { handler: src/pasos.resumir }             # HOOK 2.ª nube (IA)
  confirmar: { handler: src/pasos.confirmar, timeout: 300 }
  reverificar: { handler: src/pasos.reverificar }
  restablecer: { handler: src/pasos.restablecer }
  cerrar: { handler: src/pasos.cerrar, timeout: 300 }
  sinResolver: { handler: src/pasos.sin_resolver }
  manejarFallo: { handler: src/pasos.manejar_fallo }
  replicarNube2: { handler: src/pasos.replicar_nube2 }  # HOOK 2.ª nube (réplica al histórico)

stepFunctions:
  validate: true
  stateMachines:
    incidenteColectivo:
      id: MaquinaIncidenteColectivo
      name: ${self:custom.prefijo}-incidente-colectivo
      role: arn:aws:iam::${aws:accountId}:role/LabRole
      # Solo errores y sin datos de ejecución: los logs no deben contener datos personales (AGENTS.md R3).
      # NO VERIFICADO EN AWS: LabRole debe permitir la entrega de logs (logs:CreateLogDelivery...); si el primer
      # despliegue falla por esto, quitar loggingConfig y el LogGroup (no afecta al flujo).
      loggingConfig:
        level: ERROR
        includeExecutionData: false
        destinations:
          - Fn::GetAtt: [LogsMaquinaIncidenteColectivo, Arn]
      definition: ${file(./statemachines/incidente-colectivo.yml)}

resources:
  Resources:
    LogsMaquinaIncidenteColectivo:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/vendedlogs/states/${self:custom.prefijo}-incidente-colectivo
        RetentionInDays: 7
  Outputs:
    MaquinaIncidenteColectivoArn: { Value: !Ref MaquinaIncidenteColectivo }
