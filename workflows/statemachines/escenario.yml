# Escenario de demo (E5): tormenta o corte de energía en oleadas.
# Entrada: {"tipo": "TORMENTA" | "CORTE_ENERGIA", "zonaId": "ZONA-05"}
Comment: Escenario de demo - fallas de antenas y reportes de vecinos en oleadas
StartAt: Preparar
States:
  Preparar:
    Type: Task
    Resource: { "Fn::GetAtt": [detector, Arn] }
    Parameters:
      "accion": escenarioPreparar
      "tipo.$": "$.tipo"
      "zonaId.$": "$.zonaId"
      "ejecucionArn.$": "$$.Execution.Id"
    ResultPath: $.plan
    Retry: &reintentos
      - ErrorEquals: [Lambda.TooManyRequestsException]   # D14: el motor está ocupado (tope de concurrencia) → esperar, no fallar
        IntervalSeconds: 2
        MaxAttempts: 40
        BackoffRate: 1.5
        MaxDelaySeconds: 15
        JitterStrategy: FULL
      - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException]
        IntervalSeconds: 2
        MaxAttempts: 3
        BackoffRate: 2
    Catch: &alFallar
      - ErrorEquals: [States.ALL]
        ResultPath: $.error
        Next: Finalizar
    Next: Oleadas

  # Map secuencial: cada oleada espera su turno y luego se aplica (la tormenta "avanza").
  Oleadas:
    Type: Map
    ItemsPath: $.plan.oleadas
    MaxConcurrency: 1
    ItemProcessor:
      ProcessorConfig: { Mode: INLINE }
      StartAt: Esperar
      States:
        Esperar:
          Type: Wait
          SecondsPath: $.esperaSegundos
          Next: AplicarOleada
        AplicarOleada:
          Type: Task
          Resource: { "Fn::GetAtt": [detector, Arn] }
          Parameters: { "accion": "escenarioOleada", "datos.$": "$" }
          Retry: *reintentos
          End: true
    ResultPath: null
    Catch: *alFallar
    Next: Finalizar

  Finalizar:
    Type: Task
    Resource: { "Fn::GetAtt": [detector, Arn] }
    Parameters: { "accion": "escenarioFinalizar", "datos.$": "$" }
    ResultPath: $.resultado
    Retry: *reintentos
    End: true
