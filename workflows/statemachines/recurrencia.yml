# Recurrencia (E6): todos los días, marca las antenas con fallas repetidas como problema estructural.
Comment: Antenas con fallas repetidas en la ventana -> problema estructural + alerta al NOC
StartAt: ContarFallas
States:
  ContarFallas:
    Type: Task
    Resource: { "Fn::GetAtt": [detector, Arn] }
    Parameters: { "accion": "recurrenciaContar", "datos.$": "$" }
    ResultPath: $.conteo
    Retry: &reintentos
      - ErrorEquals: [Lambda.TooManyRequestsException]   # D14: el motor está ocupado (tope de concurrencia) → esperar, no fallar
        IntervalSeconds: 2
        MaxAttempts: 40
        BackoffRate: 1.5
        MaxDelaySeconds: 15
        JitterStrategy: FULL
      - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException]
        IntervalSeconds: 2
        MaxAttempts: 3
        BackoffRate: 2
    Next: HayEstructurales
  HayEstructurales:
    Type: Choice
    Choices:
      - Variable: $.conteo.hay
        BooleanEquals: true
        Next: MarcarEstructurales
    Default: Resumen
  MarcarEstructurales:
    Type: Map
    ItemsPath: $.conteo.estructurales
    MaxConcurrency: 1
    ItemProcessor:
      ProcessorConfig: { Mode: INLINE }
      StartAt: Marcar
      States:
        Marcar:
          Type: Task
          Resource: { "Fn::GetAtt": [detector, Arn] }
          Parameters: { "accion": "recurrenciaMarcar", "datos.$": "$" }
          Retry: *reintentos
          End: true
    ResultPath: $.marcadas
    Next: Resumen
  Resumen:
    Type: Task
    Resource: { "Fn::GetAtt": [detector, Arn] }
    Parameters: { "accion": "recurrenciaResumen", "datos.$": "$" }
    ResultPath: $.resumen
    Retry: *reintentos
    End: true
