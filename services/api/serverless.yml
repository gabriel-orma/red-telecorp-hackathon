# Stack API: un único HTTP API (HTTPS) para el frontend y los datos.
#   /api/*  → endpoints JSON
#   /*      → frontend (S3 de solo lectura vía integración HTTP, sin Lambda; CloudFront bloqueado en Learner Lab)
# Mismo origen para web y API: sin CORS ni URLs que inyectar en el build.
service: telecorp-api
frameworkVersion: "3"

custom:
  base: telecorp-base-${sls:stage}
  antenas: telecorp-antenas-${sls:stage}
  prefijo: telecorp-${sls:stage}

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  memorySize: 256
  timeout: 15
  logRetentionInDays: 7
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  layers:
    - ${cf:${self:custom.base}.ComunLambdaLayerQualifiedArn}
  websocketsApiName: ${self:custom.prefijo}-tiempo-real
  websocketsApiRouteSelectionExpression: $request.body.accion
  httpApi:
    name: ${self:custom.prefijo}-api
    authorizers:
      cognito:   # valida el ID token de Cognito (D9)
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${aws:region}.amazonaws.com/${cf:${self:custom.base}.UserPoolId}
        audience:
          - ${cf:${self:custom.base}.UserPoolClientId}
  environment:
    STAGE: ${sls:stage}
    TABLA_METRICAS: ${cf:${self:custom.base}.TablaMetricasNombre}
    TABLA_ANTENAS: ${cf:${self:custom.base}.TablaAntenasNombre}
    TABLA_HISTORIAL: ${cf:${self:custom.base}.TablaHistorialNombre}
    TABLA_INCIDENCIAS: ${cf:${self:custom.base}.TablaIncidenciasNombre}
    TABLA_DEDUP: ${cf:${self:custom.base}.TablaDedupNombre}
    TABLA_COLECTIVOS: ${cf:${self:custom.base}.TablaColectivosNombre}
    TABLA_ESTADISTICAS: ${cf:${self:custom.base}.TablaEstadisticasNombre}
    TABLA_CONEXIONES: ${cf:${self:custom.base}.TablaConexionesNombre}
    TOPICO_AVISOS: ${cf:${self:custom.base}.TopicoAvisosArn}
    COLA_REPORTES_URL: ${cf:${self:custom.base}.ColaReportesUrl}

package:
  patterns: ["!**", "src/**"]

functions:
  # PRESUPUESTO DE CONCURRENCIA (decisión D14): AWS Academy desactiva la cuenta si hay más de 10 Lambdas ejecutándose a
  # la vez. Cada función lleva `reservedConcurrency` (tope duro de AWS) y el total de TODOS los stacks es 7
  # (prueba: tests/test_presupuesto_concurrencia.py). No agregar funciones sin tope.

  # Router único: todas las rutas HTTP y WebSocket (src/router.py elige el handler según routeKey).
  api:
    handler: src/router.handler
    name: ${self:custom.prefijo}-api
    reservedConcurrency: 2
    memorySize: 512
    timeout: 30
    environment:
      PROGRAMACION_SIMULADOR: ${cf:${self:custom.antenas}.ProgramacionSimuladorNombre}
      FUNCION_SIMULADOR: ${cf:${self:custom.antenas}.SimuladorFuncion}
      WS_URL: !Sub "wss://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}"
      USER_POOL_ID: ${cf:${self:custom.base}.UserPoolId}
      USER_POOL_CLIENT_ID: ${cf:${self:custom.base}.UserPoolClientId}
      # Nombres deterministas: el stack workflows se despliega después del api.
      MAQUINA_COLECTIVO: arn:aws:states:${aws:region}:${aws:accountId}:stateMachine:${self:custom.prefijo}-incidente-colectivo
      MAQUINA_RECURRENCIA: arn:aws:states:${aws:region}:${aws:accountId}:stateMachine:${self:custom.prefijo}-recurrencia
      MAQUINA_ESCENARIO: arn:aws:states:${aws:region}:${aws:accountId}:stateMachine:${self:custom.prefijo}-escenario
    events:
      - httpApi: { method: GET, path: "/api/antenas" }
      - httpApi: { method: GET, path: "/api/zonas" }
      - httpApi: { method: GET, path: "/api/zonas/ubicar" }
      - httpApi: { method: GET, path: "/api/antenas/{antenaId}/metricas" }
      - httpApi: { method: GET, path: "/api/simulador", authorizer: { name: cognito } }
      - httpApi: { method: PUT, path: "/api/simulador", authorizer: { name: cognito } }
      - httpApi: { method: POST, path: "/api/reportes", authorizer: { name: cognito } }
      - httpApi: { method: GET, path: "/api/mis-reportes", authorizer: { name: cognito } }
      - httpApi: { method: GET, path: "/api/estado" }
      - httpApi: { method: GET, path: "/api/config" }
      - httpApi: { method: GET, path: "/api/incidencias" }
      - httpApi: { method: GET, path: "/api/incidencias/{incidenciaId}" }
      - httpApi: { method: GET, path: "/api/operador/incidencias", authorizer: { name: cognito } }
      - httpApi: { method: GET, path: "/api/operador/incidencias/{incidenciaId}", authorizer: { name: cognito } }
      - httpApi: { method: PATCH, path: "/api/incidencias/{incidenciaId}/estado", authorizer: { name: cognito } }
      - httpApi: { method: GET, path: "/api/colectivos" }
      - httpApi: { method: GET, path: "/api/colectivos/{colectivoId}", authorizer: { name: cognito } }
      - httpApi: { method: POST, path: "/api/colectivos/reanudar", authorizer: { name: cognito } }
      - httpApi: { method: POST, path: "/api/colectivos/{colectivoId}/restablecer", authorizer: { name: cognito } }
      - httpApi: { method: GET, path: "/api/analitica" }
      - httpApi: { method: POST, path: "/api/recurrencia", authorizer: { name: cognito } }
      - httpApi: { method: GET, path: "/api/nubes", authorizer: { name: cognito } }
      - httpApi: { method: GET, path: "/api/linea-tiempo", authorizer: { name: cognito } }
      - httpApi: { method: GET, path: "/api/escenarios" }
      - httpApi: { method: POST, path: "/api/escenarios", authorizer: { name: cognito } }
      - httpApi: { method: POST, path: "/api/escenarios/reiniciar", authorizer: { name: cognito } }
      - websocket: $connect
      - websocket: $disconnect
      - websocket: $default

  # Segundo plano: registrar reportes (SQS) y avisar a los paneles (3 streams). 1 a la vez: la cola y los streams
  # guardan lo que llegue mientras tanto (nada se pierde; solo espera).
  segundoPlano:
    handler: src/segundo_plano.handler
    name: ${self:custom.prefijo}-segundo-plano
    reservedConcurrency: 1
    timeout: 30
    environment:
      WS_ENDPOINT: !Sub "https://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}"
    events:
      - sqs:
          arn: ${cf:${self:custom.base}.ColaReportesArn}
          batchSize: 10
          functionResponseType: ReportBatchItemFailures
      - stream: { type: dynamodb, arn: "${cf:${self:custom.base}.TablaAntenasStreamArn}", startingPosition: LATEST, batchSize: 100, maximumBatchingWindowInSeconds: 5, maximumRetryAttempts: 1 }
      - stream: { type: dynamodb, arn: "${cf:${self:custom.base}.TablaColectivosStreamArn}", startingPosition: LATEST, batchSize: 100, maximumBatchingWindowInSeconds: 2, maximumRetryAttempts: 1 }
      - stream: { type: dynamodb, arn: "${cf:${self:custom.base}.TablaIncidenciasStreamArn}", startingPosition: LATEST, batchSize: 100, maximumBatchingWindowInSeconds: 2, maximumRetryAttempts: 1 }

resources:
  Resources:
    BucketFrontend:
      Type: AWS::S3::Bucket
      Properties:
        VersioningConfiguration: { Status: Enabled }
        # Lectura pública SOLO por política (GetObject); sin ACL públicas ni listado del bucket.
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          IgnorePublicAcls: true
          BlockPublicPolicy: false
          RestrictPublicBuckets: false
        LifecycleConfiguration:
          Rules:
            - Id: limpiar-versiones-viejas
              Status: Enabled
              NoncurrentVersionExpiration: { NoncurrentDays: 7 }
    PoliticaBucketFrontend:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref BucketFrontend
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: LecturaPublicaDelFrontend
              Effect: Allow
              Principal: "*"
              Action: s3:GetObject
              Resource: !Sub "${BucketFrontend.Arn}/*"

    # El frontend llega por el MISMO HTTP API (HTTPS, mismo origen que /api) pero sin Lambda: integración HTTP directa a
    # S3. Antes lo servía una Lambda: abrir la app pedía ~12 archivos a la vez = 12 Lambdas (decisión D14).
    IntegracionFrontendIndex:
      Type: AWS::ApiGatewayV2::Integration
      Properties:
        ApiId: !Ref HttpApi
        IntegrationType: HTTP_PROXY
        IntegrationMethod: GET
        IntegrationUri: !Sub "https://${BucketFrontend.RegionalDomainName}/index.html"
        PayloadFormatVersion: "1.0"
    IntegracionFrontendAssets:
      Type: AWS::ApiGatewayV2::Integration
      Properties:
        ApiId: !Ref HttpApi
        IntegrationType: HTTP_PROXY
        IntegrationMethod: GET
        IntegrationUri: !Sub "https://${BucketFrontend.RegionalDomainName}/assets/{proxy}"
        PayloadFormatVersion: "1.0"
    IntegracionFrontendFavicon:
      Type: AWS::ApiGatewayV2::Integration
      Properties:
        ApiId: !Ref HttpApi
        IntegrationType: HTTP_PROXY
        IntegrationMethod: GET
        IntegrationUri: !Sub "https://${BucketFrontend.RegionalDomainName}/favicon.svg"
        PayloadFormatVersion: "1.0"
    RutaFrontendRaiz:
      Type: AWS::ApiGatewayV2::Route
      Properties: { ApiId: !Ref HttpApi, RouteKey: "GET /", Target: !Sub "integrations/${IntegracionFrontendIndex}" }
    RutaFrontendSpa:   # cualquier ruta de la SPA (/mapa, /portal/...) → index.html; las rutas /api/* son más específicas
      Type: AWS::ApiGatewayV2::Route
      Properties: { ApiId: !Ref HttpApi, RouteKey: "GET /{proxy+}", Target: !Sub "integrations/${IntegracionFrontendIndex}" }
    RutaFrontendAssets:
      Type: AWS::ApiGatewayV2::Route
      Properties: { ApiId: !Ref HttpApi, RouteKey: "GET /assets/{proxy+}", Target: !Sub "integrations/${IntegracionFrontendAssets}" }
    RutaFrontendFavicon:
      Type: AWS::ApiGatewayV2::Route
      Properties: { ApiId: !Ref HttpApi, RouteKey: "GET /favicon.svg", Target: !Sub "integrations/${IntegracionFrontendFavicon}" }
  Outputs:
    BucketFrontendNombre: { Value: !Ref BucketFrontend }
    Url: { Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com" }
