# Stack API: un único HTTP API (HTTPS) para el frontend y los datos.
#   /api/*  → endpoints JSON
#   /*      → frontend (S3 privado servido por Lambda; CloudFront bloqueado en Learner Lab, ver D1)
# Mismo origen para web y API: sin CORS ni URLs que inyectar en el build.
service: telecorp-api
frameworkVersion: "3"

custom:
  base: telecorp-base-${sls:stage}
  antenas: telecorp-antenas-${sls:stage}
  prefijo: telecorp-${sls:stage}

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  memorySize: 256
  timeout: 15
  logRetentionInDays: 7
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  layers:
    - ${cf:${self:custom.base}.ComunLambdaLayerQualifiedArn}
  websocketsApiName: ${self:custom.prefijo}-tiempo-real
  websocketsApiRouteSelectionExpression: $request.body.accion
  httpApi:
    name: ${self:custom.prefijo}-api
    authorizers:
      cognito:   # valida el ID token de Cognito (D9)
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${aws:region}.amazonaws.com/${cf:${self:custom.base}.UserPoolId}
        audience:
          - ${cf:${self:custom.base}.UserPoolClientId}
  environment:
    STAGE: ${sls:stage}
    TABLA_METRICAS: ${cf:${self:custom.base}.TablaMetricasNombre}
    TABLA_ANTENAS: ${cf:${self:custom.base}.TablaAntenasNombre}
    TABLA_HISTORIAL: ${cf:${self:custom.base}.TablaHistorialNombre}
    TABLA_INCIDENCIAS: ${cf:${self:custom.base}.TablaIncidenciasNombre}
    TABLA_DEDUP: ${cf:${self:custom.base}.TablaDedupNombre}
    TABLA_COLECTIVOS: ${cf:${self:custom.base}.TablaColectivosNombre}
    TABLA_ESTADISTICAS: ${cf:${self:custom.base}.TablaEstadisticasNombre}
    TABLA_CONEXIONES: ${cf:${self:custom.base}.TablaConexionesNombre}
    TOPICO_AVISOS: ${cf:${self:custom.base}.TopicoAvisosArn}
    COLA_REPORTES_URL: ${cf:${self:custom.base}.ColaReportesUrl}

package:
  patterns: ["!**", "src/**"]

functions:
  antenas:
    handler: src/antenas.listar_antenas
    events:
      - httpApi: GET /api/antenas
  zonas:
    handler: src/antenas.listar_zonas
    events:
      - httpApi: GET /api/zonas
  ubicarZona:
    handler: src/antenas.ubicar_zona
    events:
      - httpApi: GET /api/zonas/ubicar
  metricasAntena:
    handler: src/antenas.metricas_antena
    events:
      - httpApi: GET /api/antenas/{antenaId}/metricas
  simuladorObtener:
    handler: src/simulador.obtener
    environment: &simulador
      PROGRAMACION_SIMULADOR: ${cf:${self:custom.antenas}.ProgramacionSimuladorNombre}
      FUNCION_SIMULADOR: ${cf:${self:custom.antenas}.SimuladorFuncion}
    events:
      - httpApi: GET /api/simulador
  simuladorActualizar:
    handler: src/simulador.actualizar
    environment: *simulador
    events:
      - httpApi: PUT /api/simulador
  # ---------- Incidencias (E2) ----------
  crearReporte:
    handler: src/incidencias.crear_reporte
    events:
      - httpApi: { method: POST, path: /api/reportes, authorizer: { name: cognito } }
  misReportes:
    handler: src/incidencias.mis_reportes
    events:
      - httpApi: { method: GET, path: /api/mis-reportes, authorizer: { name: cognito } }
  # ---------- Estado público (E3.5) ----------
  estadoRed:
    handler: src/estado.estado
    memorySize: 512
    events:
      - httpApi: GET /api/estado
  config:
    handler: src/estado.config
    environment:
      WS_URL: !Sub "wss://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}"
      USER_POOL_ID: ${cf:${self:custom.base}.UserPoolId}
      USER_POOL_CLIENT_ID: ${cf:${self:custom.base}.UserPoolClientId}
    events:
      - httpApi: GET /api/config
  registrarReporte:
    handler: src/incidencias.registrar
    timeout: 30
    events:
      - sqs:
          arn: ${cf:${self:custom.base}.ColaReportesArn}
          batchSize: 10   # sin ventana de agrupación: cada reporte se registra apenas llega
          functionResponseType: ReportBatchItemFailures
  listarIncidencias:
    handler: src/incidencias.listar
    events:
      - httpApi: GET /api/incidencias
  obtenerIncidencia:
    handler: src/incidencias.obtener
    events:
      - httpApi: GET /api/incidencias/{incidenciaId}
  cambiarEstadoIncidencia:
    handler: src/incidencias.cambiar_estado
    events:
      - httpApi: PATCH /api/incidencias/{incidenciaId}/estado
  # ---------- Incidentes colectivos (E3) ----------
  listarColectivos:
    handler: src/colectivos.listar
    events:
      - httpApi: GET /api/colectivos
  obtenerColectivo:
    handler: src/colectivos.obtener
    events:
      - httpApi: GET /api/colectivos/{colectivoId}
  reanudarColectivos:
    handler: src/colectivos.reanudar
    timeout: 30
    environment:
      MAQUINA_COLECTIVO: arn:aws:states:${aws:region}:${aws:accountId}:stateMachine:${self:custom.prefijo}-incidente-colectivo
    events:
      - httpApi: POST /api/colectivos/reanudar
  restablecerColectivo:
    handler: src/colectivos.restablecer
    events:
      - httpApi: POST /api/colectivos/{colectivoId}/restablecer
  # ---------- Tiempo real (E7): WebSocket + difusor ----------
  wsConectar:
    handler: src/tiempo_real.conectar
    events:
      - websocket: $connect
  wsDesconectar:
    handler: src/tiempo_real.desconectar
    events:
      - websocket: $disconnect
  wsMensaje:
    handler: src/tiempo_real.mensaje
    events:
      - websocket: $default
  difusor:
    handler: src/tiempo_real.difundir
    timeout: 30
    environment:
      WS_ENDPOINT: !Sub "https://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}"
    events:
      - stream: { type: dynamodb, arn: "${cf:${self:custom.base}.TablaAntenasStreamArn}", startingPosition: LATEST, batchSize: 100, maximumBatchingWindowInSeconds: 1, maximumRetryAttempts: 1 }
      - stream: { type: dynamodb, arn: "${cf:${self:custom.base}.TablaColectivosStreamArn}", startingPosition: LATEST, batchSize: 100, maximumBatchingWindowInSeconds: 1, maximumRetryAttempts: 1 }
      - stream: { type: dynamodb, arn: "${cf:${self:custom.base}.TablaIncidenciasStreamArn}", startingPosition: LATEST, batchSize: 100, maximumBatchingWindowInSeconds: 1, maximumRetryAttempts: 1 }
  # ---------- Analítica operativa (E6) ----------
  analitica:
    handler: src/analitica.analitica
    memorySize: 512
    timeout: 25
    events:
      - httpApi: GET /api/analitica
  ejecutarRecurrencia:
    handler: src/analitica.ejecutar_recurrencia
    environment:
      MAQUINA_RECURRENCIA: arn:aws:states:${aws:region}:${aws:accountId}:stateMachine:${self:custom.prefijo}-recurrencia
    events:
      - httpApi: POST /api/recurrencia
  # ---------- Línea de tiempo estilo editor de video ----------
  lineaTiempo:
    handler: src/linea_tiempo.linea_tiempo
    memorySize: 512
    timeout: 20
    events:
      - httpApi: GET /api/linea-tiempo
  # ---------- Escenarios de demo (E5) ----------
  escenarioObtener:
    handler: src/escenarios.obtener
    events:
      - httpApi: GET /api/escenarios
  escenarioLanzar:
    handler: src/escenarios.lanzar
    environment:
      # Nombre determinista: el stack workflows se despliega después del api.
      MAQUINA_ESCENARIO: arn:aws:states:${aws:region}:${aws:accountId}:stateMachine:${self:custom.prefijo}-escenario
    events:
      - httpApi: POST /api/escenarios
  escenarioReiniciar:
    handler: src/escenarios.reiniciar
    timeout: 30
    environment:
      FUNCION_SIMULADOR: ${cf:${self:custom.antenas}.SimuladorFuncion}
      MAQUINA_COLECTIVO: arn:aws:states:${aws:region}:${aws:accountId}:stateMachine:${self:custom.prefijo}-incidente-colectivo
    events:
      - httpApi: POST /api/escenarios/reiniciar
  web:
    handler: src/web.handler
    memorySize: 512
    environment:
      BUCKET_FRONTEND: !Ref BucketFrontend
    events:
      - httpApi: GET /
      - httpApi: GET /{proxy+}

resources:
  Resources:
    BucketFrontend:
      Type: AWS::S3::Bucket
      Properties:
        VersioningConfiguration: { Status: Enabled }
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        LifecycleConfiguration:
          Rules:
            - Id: limpiar-versiones-viejas
              Status: Enabled
              NoncurrentVersionExpiration: { NoncurrentDays: 7 }
  Outputs:
    BucketFrontendNombre: { Value: !Ref BucketFrontend }
    Url: { Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com" }
