# Stack BASE: datos y recursos compartidos (sin lógica de negocio).
# Lo crea UNA sola vez y lo exporta como Outputs; los demás stacks lo leen con ${cf:telecorp-base-<stage>.<Output>}.
# Desplegar con: bash scripts/deploy.sh <stage>   (copia el catálogo de zonas al layer antes)
service: telecorp-base
frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole

custom:
  prefijo: telecorp-${sls:stage}

package:
  # Solo exclusiones: un "!**" a nivel de servicio también vaciaría el layer.
  patterns: ["!layer/**", "!tests/**", "!README.md"]

functions:
  # Trigger PreSignUp de Cognito: valida el perfil y auto-confirma (D9)
  preRegistro:
    handler: src/pre_registro.handler
    name: ${self:custom.prefijo}-pre-registro
    layers:
      - !Ref ComunLambdaLayer

layers:
  comun:
    path: layer
    name: ${self:custom.prefijo}-comun
    description: Código compartido de Red TeleCorp (telecorp.*)
    compatibleRuntimes: [python3.12]

resources:
  Resources:
    # ---------- DynamoDB: tablas separadas, on-demand, PITR (D8) ----------
    TablaIncidencias:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.prefijo}-incidencias
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
        AttributeDefinitions:
          - { AttributeName: incidenciaId, AttributeType: S }
          - { AttributeName: zonaId, AttributeType: S }
          - { AttributeName: creadaEn, AttributeType: S }
          - { AttributeName: usuarioId, AttributeType: S }
        KeySchema: [{ AttributeName: incidenciaId, KeyType: HASH }]
        GlobalSecondaryIndexes:
          - IndexName: zona-fecha
            KeySchema: [{ AttributeName: zonaId, KeyType: HASH }, { AttributeName: creadaEn, KeyType: RANGE }]
            Projection: { ProjectionType: ALL }
          - IndexName: usuario-fecha   # "mis reportes" (E3.5)
            KeySchema: [{ AttributeName: usuarioId, KeyType: HASH }, { AttributeName: creadaEn, KeyType: RANGE }]
            Projection: { ProjectionType: ALL }
        StreamSpecification: { StreamViewType: NEW_AND_OLD_IMAGES }

    TablaHistorial:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.prefijo}-historial
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
        AttributeDefinitions:
          - { AttributeName: entidadId, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
        KeySchema: [{ AttributeName: entidadId, KeyType: HASH }, { AttributeName: sk, KeyType: RANGE }]

    TablaMetricas:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.prefijo}-metricas
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
        AttributeDefinitions:
          - { AttributeName: antenaId, AttributeType: S }
          - { AttributeName: medidoEn, AttributeType: S }
        KeySchema: [{ AttributeName: antenaId, KeyType: HASH }, { AttributeName: medidoEn, KeyType: RANGE }]
        TimeToLiveSpecification: { AttributeName: expiraEn, Enabled: true }

    TablaAntenas:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.prefijo}-antenas
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
        AttributeDefinitions: [{ AttributeName: antenaId, AttributeType: S }]
        KeySchema: [{ AttributeName: antenaId, KeyType: HASH }]
        StreamSpecification: { StreamViewType: NEW_AND_OLD_IMAGES }

    TablaColectivos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.prefijo}-colectivos
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
        AttributeDefinitions:
          - { AttributeName: incidenteColectivoId, AttributeType: S }
          - { AttributeName: zonaId, AttributeType: S }
          - { AttributeName: estado, AttributeType: S }
        KeySchema: [{ AttributeName: incidenteColectivoId, KeyType: HASH }]
        StreamSpecification: { StreamViewType: KEYS_ONLY }  # E7: avisos en tiempo real al panel
        GlobalSecondaryIndexes:
          - IndexName: zona-estado
            KeySchema: [{ AttributeName: zonaId, KeyType: HASH }, { AttributeName: estado, KeyType: RANGE }]
            Projection: { ProjectionType: ALL }

    # Conexiones WebSocket del panel (E7). TTL: las abandonadas caducan solas.
    TablaConexiones:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.prefijo}-conexiones
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions: [{ AttributeName: connectionId, AttributeType: S }]
        KeySchema: [{ AttributeName: connectionId, KeyType: HASH }]
        TimeToLiveSpecification: { AttributeName: expiraEn, Enabled: true }

    # Contadores agregados para la página pública de estado (D10): 96 ítems por día y serie.
    TablaEstadisticas:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.prefijo}-estadisticas
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
        AttributeDefinitions:
          - { AttributeName: serie, AttributeType: S }
          - { AttributeName: bucket, AttributeType: S }
        KeySchema: [{ AttributeName: serie, KeyType: HASH }, { AttributeName: bucket, KeyType: RANGE }]
        TimeToLiveSpecification: { AttributeName: expiraEn, Enabled: true }

    # ---------- Cognito: cuentas de usuario (D9) ----------
    UserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:custom.prefijo}-usuarios
        UsernameAttributes: [email]
        AutoVerifiedAttributes: [email]
        Policies:
          PasswordPolicy: { MinimumLength: 8, RequireLowercase: true, RequireNumbers: true, RequireUppercase: false, RequireSymbols: false }
        Schema:
          - { Name: email, AttributeDataType: String, Required: true, Mutable: true }
          - { Name: name, AttributeDataType: String, Required: true, Mutable: true }
          - { Name: phone_number, AttributeDataType: String, Required: false, Mutable: true }
          # H13: `dni` debería ser Mutable: false, pero CloudFormation REEMPLAZA el user pool al cambiar `Schema` (se pierden
          # las cuentas). Mitigado en el backend: la identidad es el `sub` del token, no `custom:dni` (services/api/src/acceso.py).
          # En un stage NUEVO (sin cuentas) sí conviene ponerlo en false; en uno existente, solo si se aceptan cuentas nuevas.
          - { Name: dni, AttributeDataType: String, Mutable: true, StringAttributeConstraints: { MinLength: "8", MaxLength: "12" } }
          - { Name: numeroServicio, AttributeDataType: String, Mutable: true }
          - { Name: zonaId, AttributeDataType: String, Mutable: true }
          - { Name: avisosEmail, AttributeDataType: String, Mutable: true }
        LambdaConfig:
          PreSignUp: !GetAtt PreRegistroLambdaFunction.Arn
    UserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: web
        UserPoolId: !Ref UserPool
        GenerateSecret: false
        ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
        PreventUserExistenceErrors: ENABLED
        IdTokenValidity: 60
        AccessTokenValidity: 60
        RefreshTokenValidity: 30
        TokenValidityUnits: { IdToken: minutes, AccessToken: minutes, RefreshToken: days }
        ReadAttributes: [email, name, phone_number, custom:dni, custom:numeroServicio, custom:zonaId, custom:avisosEmail]
        WriteAttributes: [email, name, phone_number, custom:dni, custom:numeroServicio, custom:zonaId, custom:avisosEmail]
    # Rol de operador (H01): el autorizador JWT del API valida el token y las rutas de administración exigen que el claim
    # `cognito:groups` contenga `operadores`. Alta de un operador: services/api/README.md ("Operadores").
    GrupoOperadores:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: operadores
        Description: Personal de Red TeleCorp con acceso al centro de operaciones
        UserPoolId: !Ref UserPool
    PermisoCognitoPreRegistro:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !GetAtt PreRegistroLambdaFunction.Arn
        Principal: cognito-idp.amazonaws.com
        SourceArn: !GetAtt UserPool.Arn

    # Deduplicación de reportes: una clave por usuario+zona mientras su incidencia está activa (máx. 24 h, TTL).
    TablaDedup:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.prefijo}-dedup
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions: [{ AttributeName: clave, AttributeType: S }]
        KeySchema: [{ AttributeName: clave, KeyType: HASH }]
        TimeToLiveSpecification: { AttributeName: expiraEn, Enabled: true }

    # ---------- SQS: colchón anti-avalancha con DLQ ----------
    ColaReportesDLQ:
      Type: AWS::SQS::Queue
      Properties: { QueueName: "${self:custom.prefijo}-reportes-dlq", MessageRetentionPeriod: 1209600 }
    ColaReportes:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.prefijo}-reportes
        VisibilityTimeout: 180
        RedrivePolicy: { deadLetterTargetArn: !GetAtt ColaReportesDLQ.Arn, maxReceiveCount: 5 }  # AWS recomienda ≥5 con Lambda (H27)
    # Eventos del detector (DynamoDB Streams) que fallaron tras los reintentos: no se pierden.
    ColaDetectorDLQ:
      Type: AWS::SQS::Queue
      Properties: { QueueName: "${self:custom.prefijo}-detector-dlq", MessageRetentionPeriod: 1209600 }
    ColaMetricasDLQ:
      Type: AWS::SQS::Queue
      Properties: { QueueName: "${self:custom.prefijo}-metricas-dlq", MessageRetentionPeriod: 1209600 }
    ColaMetricas:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.prefijo}-metricas
        VisibilityTimeout: 180
        RedrivePolicy: { deadLetterTargetArn: !GetAtt ColaMetricasDLQ.Arn, maxReceiveCount: 5 }

    # Alarmas: cualquier mensaje en una DLQ es un registro que NO se procesó (H27). Aviso por el tópico del operador.
    # Reproceso manual: aws sqs start-message-move-task --source-arn <arn de la DLQ>. Las 3 entran en la capa gratuita (10).
    AlarmaReportesDLQ:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:custom.prefijo}-reportes-dlq-con-mensajes
        AlarmDescription: "Hay reportes de usuarios que no se pudieron registrar (DLQ de reportes)"
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions: [{ Name: QueueName, Value: !GetAtt ColaReportesDLQ.QueueName }]
        Statistic: Maximum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions: [!Ref TopicoAlertasOperador]
    AlarmaMetricasDLQ:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:custom.prefijo}-metricas-dlq-con-mensajes
        AlarmDescription: "Hay métricas de antenas que no se pudieron clasificar (DLQ de métricas)"
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions: [{ Name: QueueName, Value: !GetAtt ColaMetricasDLQ.QueueName }]
        Statistic: Maximum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions: [!Ref TopicoAlertasOperador]
    AlarmaDetectorDLQ:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:custom.prefijo}-detector-dlq-con-mensajes
        AlarmDescription: "El detector de colectivos descartó eventos tras sus reintentos (DLQ del detector)"
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions: [{ Name: QueueName, Value: !GetAtt ColaDetectorDLQ.QueueName }]
        Statistic: Maximum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions: [!Ref TopicoAlertasOperador]

    # ---------- Configuración (SSM) y secretos (Secrets Manager) ----------
    ParametroSimulador:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /telecorp/${sls:stage}/simulador
        Type: String
        Description: "Simulador de antenas. fallas = {antenaId: GB/min forzado}"
        Value: '{"fallas": {}, "probSaturacion": 0.03, "muestrasPorMinuto": 4}'
    ParametroEscenario:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /telecorp/${sls:stage}/escenario
        Type: String
        Description: "Estado del escenario de demo en curso (E5)"
        Value: '{"activo": false}'
    ParametroRecurrencia:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /telecorp/${sls:stage}/recurrencia
        Type: String
        Description: "Última ejecución del análisis de recurrencia (E6)"
        Value: '{"ultimaEjecucion": null}'
    ParametroReglas:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /telecorp/${sls:stage}/reglas
        Type: String
        Description: "Reglas de negocio ajustables sin desplegar código (prioridad = TODO D7)"
        Value: >-
          {"colectivo": {"umbralUsuarios": 10, "ventanaHoras": 24, "esperaVerificacionSegundos": 30, "maxIteraciones": 2000,
          "maxMonitoreoMinutos": 2880, "cierreSinReportesMinutos": 60, "loteAvisos": 50},
          "prioridad": {"_todo": "TODO(D7) fórmula provisional", "pesoAfectado": 1, "pesoAntenaEnFalla": 10, "pesoHora": 0.25,
          "umbrales": {"MEDIA": 20, "ALTA": 50, "CRITICA": 100}},
          "recurrencia": {"_todo": "TODO(D7) umbral provisional", "umbralFallas": 3, "ventanaDias": 7}}

    # ---------- SNS: avisos a usuarios (email con FilterPolicy) y alertas al operador ----------
    TopicoAvisos:
      Type: AWS::SNS::Topic
      Properties: { TopicName: "${self:custom.prefijo}-avisos", DisplayName: Red TeleCorp }
    TopicoAlertasOperador:
      Type: AWS::SNS::Topic
      Properties: { TopicName: "${self:custom.prefijo}-alertas-operador", DisplayName: Red TeleCorp NOC }

    SecretoIA:
      Type: AWS::SecretsManager::Secret
      Properties:
        Name: telecorp/${sls:stage}/ia
        Description: "API key del servicio de IA de la segunda nube (D2). Se carga con: aws secretsmanager put-secret-value"
        SecretString: '{"apiKey": "PENDIENTE-D2"}'

  Outputs:
    TablaIncidenciasNombre: { Value: !Ref TablaIncidencias }
    TablaIncidenciasStreamArn: { Value: !GetAtt TablaIncidencias.StreamArn }
    TablaHistorialNombre: { Value: !Ref TablaHistorial }
    TablaMetricasNombre: { Value: !Ref TablaMetricas }
    TablaAntenasNombre: { Value: !Ref TablaAntenas }
    TablaAntenasStreamArn: { Value: !GetAtt TablaAntenas.StreamArn }
    TablaColectivosNombre: { Value: !Ref TablaColectivos }
    TablaColectivosStreamArn: { Value: !GetAtt TablaColectivos.StreamArn }
    TablaConexionesNombre: { Value: !Ref TablaConexiones }
    TablaDedupNombre: { Value: !Ref TablaDedup }
    TablaEstadisticasNombre: { Value: !Ref TablaEstadisticas }
    UserPoolId: { Value: !Ref UserPool }
    UserPoolArn: { Value: !GetAtt UserPool.Arn }
    UserPoolClientId: { Value: !Ref UserPoolClient }
    ColaReportesUrl: { Value: !Ref ColaReportes }
    ColaReportesArn: { Value: !GetAtt ColaReportes.Arn }
    ColaMetricasUrl: { Value: !Ref ColaMetricas }
    ColaMetricasArn: { Value: !GetAtt ColaMetricas.Arn }
    ColaDetectorDLQArn: { Value: !GetAtt ColaDetectorDLQ.Arn }
    SecretoIAArn: { Value: !Ref SecretoIA }
    TopicoAvisosArn: { Value: !Ref TopicoAvisos }
    TopicoAlertasOperadorArn: { Value: !Ref TopicoAlertasOperador }
